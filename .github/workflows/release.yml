name: Release

# Triggered by pushing a version tag, e.g.:
#     git tag -a v0.1.0 -m "First playable release"
#     git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

# Needed to create the release and upload the jar to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Uses the GitHub CLI, which is preinstalled on the runner, rather than a third-party
      # action -- one less dependency to trust with write access to the repository.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Everything before 1.0 is marked pre-release. The mod also targets a beta NeoForge
          # line, so this stays accurate for a while yet.
          PRERELEASE=""
          case "$TAG" in
            v0.*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$TAG" build/libs/*.jar \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
