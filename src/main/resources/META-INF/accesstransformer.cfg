# Access Transformers widen the visibility of vanilla Minecraft members so mods can call them.
# This is a supported NeoForge mechanism, not a hack. Each line is:
#
#   <new-visibility> <fully.qualified.ClassName> <memberName><descriptor>
#
# The descriptor is the JVM's way of writing a method signature: parameter types in
# parentheses, then the return type. L...; means "an object of this class", V means void.
# So (Lnet/minecraft/world/entity/player/Player;)V is "takes a Player, returns nothing".

# Villager#updateSpecialPrices(Player) is private in vanilla. Villager#startTrading calls it
# just before opening the merchant screen, and it applies the reputation-based discount --
# so a villager who likes you charges less. We reproduce startTrading in VillagerTrading,
# and skipping this call would silently rob players of that discount.
#
# Everything else the trade handoff needs (setTradingPlayer, openTradingScreen,
# getPlayerReputation) is already public in 26.2, so this is the only line needed.
public net.minecraft.world.entity.npc.villager.Villager updateSpecialPrices(Lnet/minecraft/world/entity/player/Player;)V

# Villager#gossips is private with no public write access -- getPlayerReputation only reads it,
# and onReputationEventFrom handles just the five hardcoded vanilla events, none of which mean
# "was given a gift". Widening the field lets us add MINOR_POSITIVE gossip directly.
#
# Fields need no descriptor, only the name. "public" widens visibility while leaving the field
# final, which is all we need -- we call methods on the container, never reassign it.
public net.minecraft.world.entity.npc.villager.Villager gossips
